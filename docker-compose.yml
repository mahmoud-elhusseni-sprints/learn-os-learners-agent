services:

  neo4j:
    image: neo4j:5-community

    container_name: learner-graph-neo4j

    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}

    ports:
      - "7474:7474"
      - "7687:7687"

    volumes:
      - neo4j_data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: learner-graph-api

    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}

    ports:
      - "8000:8000"

    depends_on:
      neo4j:
        condition: service_healthy

    volumes:
      - .:/app


volumes:
  neo4j_data: