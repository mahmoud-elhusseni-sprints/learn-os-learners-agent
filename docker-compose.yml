services:

  neo4j:
    image: neo4j:5-community

    container_name: learner-graph-neo4j

    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}

    ports:
      - "7474:7474"
      - "7687:7687"

    volumes:
      - neo4j_data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  postgres:
    image: postgres:16

    container_name: learner-postgres

    environment:
      POSTGRES_DB: learner_os
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d learner_os"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: learner-graph-api

    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}

      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/learner_os

    ports:
      - "8010:8000"

    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy

    volumes:
      - .:/app


volumes:
  neo4j_data:
  postgres_data: